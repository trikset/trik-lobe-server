[project]
name = "trik-lobe-server"
version = "26.08.04.dev0"
description = "TRIK Lobe ML inference server"
requires-python = ">=3.12,<3.14"
dependencies = [
    "opencv-python>=5.0.0.93,<6.0.0",
    "requests>=2.32.0,<3.0.0",
    "Pillow>=12.3.0,<13.0.0",
    "numpy>=2.0,<3.0",
    "onnxruntime>=1.28.0,<2.0.0",
    "ai-edge-litert>=2.1.0,<3.0.0",
]


[dependency-groups]
dev = [
    "pytest>=9.0.3,<10.0",
    "pytest-asyncio>=1.0,<2.0",
    "pytest-cov>=7.1.0,<8.0",
    "pylint>=4.0.6,<5.0",
    "basedpyright>=1.0,<2.0",
    "pyinstaller>=6.0,<7.0",
    "ruff>=0.16.0,<1.0.0",
    "mdformat>=1.0.0,<2.0.0",
    "mdformat-frontmatter>=2.1.2,<3.0",
    "bandit>=1.8.0,<2.0.0",
    "vulture>=2.14,<3.0",
    "pre-commit>=4.0,<5.0",
    "PyYAML>=6.0.3,<7.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov"

[tool.coverage.run]
source = ["lobe_server"]

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # Docstrings on every module/class/method is very high effort
    "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107",
    "D209", "D212",
    # Conflicts with the formatter — ruff-format owns trailing commas
    "COM812",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "SLF001", "PLR2004", "ANN401"]

[tool.pylint.'MESSAGES CONTROL']
disable = [
    "C0114", "C0115", "C0116", "R0903",
    "W0718",  # broad-exception-caught — intentional for reconnect loop
    "R0902",  # too-many-instance-attributes — Settings has 9 fields
    "E1101",  # no-member — cv2 C extension
    "C0103",  # invalid-name — TRIKLobeServer entry point name
    "C0301",  # line-too-long — ruff format handles this at 120
    "C0415",  # import-outside-toplevel — cv2 lazy import
]
extension-pkg-allow-list = ["cv2", "onnxruntime", "ai_edge_litert"]

[tool.pylint.MASTER]
ignore = [".venv"]

[tool.basedpyright]
typeCheckingMode = "strict"
reportPossiblyUnboundVariable = "error"
reportMissingTypeStubs = "none"
reportMissingImports = "none"

[tool.vulture]
# TypedDict string-key access is invisible to vulture — `index` is read via
# `details["index"]`, which vulture cannot trace (false positive)
ignore_names = ["index"]
