name: Python application

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync dependencies
        run: uv sync --frozen
      - name: Check for all tools
        uses: ./.github/actions/check-tools
        with:
          binaries: uv git
          uv-packages: ruff mdformat basedpyright pylint bandit vulture pytest
      - name: Check lockfile is up to date
        run: uv lock --check
      - name: Check pyproject/lockfile sync
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          git fetch --depth=1 origin "$base"
          changed="$(git diff --name-only "$base" HEAD)"
          if echo "$changed" | grep -q '^pyproject.toml$' && ! echo "$changed" | grep -q '^uv.lock$'; then
            echo "::error::pyproject.toml changed but uv.lock did not. Run 'uv lock' and commit the result."
            exit 1
          fi
      - name: Lint with ruff
        run: uv run ruff check .
      - name: Check markdown formatting
        shell: bash
        run: uv run mdformat *.md --check
      - name: Type check with basedpyright
        run: uv run basedpyright .
      - name: Lint with pylint
        run: uv run pylint lobe_server TRIKLobeServer.py tests
      - name: Security scan with bandit
        run: uv run bandit --recursive lobe_server/ TRIKLobeServer.py
      - name: Dead code check with vulture
        run: uv run vulture lobe_server/ tests/ TRIKLobeServer.py
      - name: Test with pytest
        run: uv run pytest

  build:
    needs: test
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      SCRIPT_NAME: TRIKLobeServer

    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync dependencies
        run: uv sync --frozen
      - name: Check for all tools
        uses: ./.github/actions/check-tools
        with:
          binaries: uv git
          uv-packages: pyinstaller
      - name: Build single app for ${{ env.SCRIPT_NAME }}
        run: >
          uv run pyinstaller ${{ env.SCRIPT_NAME }}.py --onefile
          ${{ runner.os == 'Windows' && '--icon=trik-studio.ico' || '' }}
      - name: Archive artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.SCRIPT_NAME }}-${{ runner.os }}
          path: |
            dist
            settings.ini

  version-check:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Check for all tools
        uses: ./.github/actions/check-tools
        with:
          binaries: uv git
          uv-packages: python
      - name: Check version matches tag
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"          # v26.08.03 -> 26.08.03
          version="$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          if [ "$tag" != "$version" ]; then
            echo "::error::pyproject.toml version $version does not match tag $GITHUB_REF_NAME"
            exit 1
          fi
          echo "Version check OK: $version == $GITHUB_REF_NAME"

  release:
    needs: [build, version-check]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      OPENCODE_ZEN_API_KEY: ${{ secrets.OPENCODE_ZEN_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - name: Install opencode
        run: npm install -g opencode-ai
      - name: Check for all tools
        uses: ./.github/actions/check-tools
        with:
          binaries: uv git gh node npm zip tar opencode
          uv-packages: python
      - name: Download binaries
        uses: actions/download-artifact@v7
        with:
          path: artifacts
      - name: Determine previous release tag
        shell: bash
        run: |
          prev="$(gh release list --limit 10 --json tagName --jq '.[].tagName' 2>/dev/null \
            | grep -v "^${GITHUB_REF_NAME}$" | head -1 || true)"
          echo "PREV_TAG=${prev:-v1.0.0}" >> "$GITHUB_ENV"
      - name: Generate release notes
        run: |
          opencode run --agent build --auto \
            "Load the release-notes skill. Generate notes for tag ${GITHUB_REF_NAME}. Previous release: ${PREV_TAG}."
      - name: Verify release notes were written
        shell: bash
        run: |
          test -s release-notes.md || { echo "::error::release-notes.md missing or empty"; exit 1; }
          head -5 release-notes.md
      - name: List artifacts
        shell: bash
        run: find artifacts -type f | sort
      - name: Package versioned archives
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"                       # v26.08.03
          # Windows -> zip (Explorer-native); Linux/macOS -> tar.gz (platform standard).
          # Each archive bundles the versioned binary + settings.ini at the root.
          mkdir -p pack/win pack/lin pack/mac
          cp artifacts/TRIKLobeServer-Windows/dist/TRIKLobeServer.exe \
             "pack/win/TRIKLobeServer-${version}.exe"
          cp artifacts/TRIKLobeServer-Windows/settings.ini "pack/win/settings.ini"
          (cd pack/win && zip -q "../TRIKLobeServer-${version}-Windows.zip" \
              "TRIKLobeServer-${version}.exe" settings.ini)
          for os in Linux macOS; do
            mkdir -p "pack/${os}"
            cp "artifacts/TRIKLobeServer-${os}/dist/TRIKLobeServer" \
               "pack/${os}/TRIKLobeServer-${version}.bin"
            cp "artifacts/TRIKLobeServer-${os}/settings.ini" "pack/${os}/settings.ini"
            (cd "pack/${os}" && tar -czf "../TRIKLobeServer-${version}-${os}.tar.gz" \
                "TRIKLobeServer-${version}.bin" settings.ini)
          done
          ls -la TRIKLobeServer-*
      - name: Publish draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          body_path: release-notes.md
          files: |
            TRIKLobeServer-${{ github.ref_name }}-Windows.zip
            TRIKLobeServer-${{ github.ref_name }}-Linux.tar.gz
            TRIKLobeServer-${{ github.ref_name }}-macOS.tar.gz
