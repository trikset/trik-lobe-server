[Settings]
; --- Robot connection ---
; IP адрес робота или TRIK Studio. Для студии обычно 127.0.0.1
ROBOT_IP=127.0.0.1
; TCP порт для отправки предсказаний роботу. Обычно 8889
ROBOT_PORT=8889
; HTTP порт видео-потока робота (video1=8080, video2=8081, video3=8082)
ROBOT_VIDEO_PORT=8080
; Борт номер этого trik-mind. Выберите не занятый роботами.
MY_HULL_NUMBER=2

; --- Model ---
; Путь к директории модели (ONNX или TFLite).
; Оставьте пустым если папка модели там же где и скрипт.
; Модель это файлы signature.json и например model.tflite.
MODEL_PATH=
; Порог показа (0..1): метки с уверенностью ниже этого уровня не отображаются
; в дашборде (только статистика). Рекомендуется: 0.4
VIEW_THRESHOLD=0.4
; Порог отправки (0..1): ниже него роботу отправляется -1 (ничего не распознано).
; Метки между VIEW_THRESHOLD и SEND_THRESHOLD видны в UI, но не отправляются.
; Рекомендация для домашнего использования: 0.6
SEND_THRESHOLD=0.6

; --- Camera source ---
; Откуда брать изображение:
;   (пусто)      — автоматически с камеры робота (ROBOT_IP:ROBOT_VIDEO_PORT), если ROBOT_IP задан
;   http://...   — URL snapshot (HTTP камера)
;   rtsp://...   — RTSP видеопоток
;   0, 1, 2...   — номер USB камеры в системе
;   /dev/video0  — путь к устройству (Linux)
CAMERA_SOURCE=

[UI]
; Режим вывода: user (цветной, для человека) или stdout (табуляция, для pipe)
OUTPUT_MODE=user
; Цветной вывод (только в режиме user)
COLOR_ENABLED=true
